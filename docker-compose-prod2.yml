version: "3.8"
services:
  web:
    image: josereyes1969/vidly-web:latest
    ports:
      - 80:80
    restart: unless-stopped # check the formats for yml's files
  api:
    image: josereyes1969/vidly-api:latest
    ports:
      - 3001:3001
    environment:
      DB_URL: mongodb://db/vidly
      CHOKIDAR_USEPOLLING: "true" # Forzar polling de archivos
      WATCHPACK_POLLING: "true" # Para Next.js / Webpack
    command: ./docker-entrypoint.sh
    restart: unless-stopped # check the formats for yml's files
  db:
    image: mongo:7.0
    ports:
      - 27017:27017
    volumes:
      - vidly:/data/db
    restart: unless-stopped # check the formats for yml's files
volumes:
  vidly:
